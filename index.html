<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skyline — Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B1739;
    --twilight:#3E2C6B;
    --dawn:#FFB88C;
    --day:#3FA9D6;
    --slate:#4A5A6B;
    --rain:#1D5C63;
    --gold:#FFC857;
    --cloud:#F5F7FA;
    --ink:#0E1A2B;
    --card:rgba(255,255,255,0.10);
    --card-border:rgba(255,255,255,0.22);
    --text:#F5F7FA;
    --text-dim:rgba(245,247,250,0.68);
    --radius:22px;
    --sky-a:var(--day);
    --sky-b:var(--twilight);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    min-height:100vh;
    font-family:'Inter',sans-serif;
    color:var(--text);
    background:linear-gradient(160deg,var(--sky-a),var(--sky-b));
    transition:background 1.4s ease;
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
    position:relative;
    overflow-x:hidden;
  }

  /* ambient sky layer */
  #sky{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    overflow:hidden;
  }
  .particle{
    position:absolute;
    border-radius:50%;
    opacity:0.55;
  }
  .star{
    background:#fff;
    box-shadow:0 0 6px 1px rgba(255,255,255,0.8);
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:0.15}50%{opacity:0.9}}
  .drop{
    width:2px;
    background:linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.55));
    animation:fall linear infinite;
  }
  @keyframes fall{0%{transform:translateY(-10vh)}100%{transform:translateY(110vh)}}
  .cloud-shape{
    background:rgba(255,255,255,0.18);
    filter:blur(1px);
    animation:drift linear infinite;
  }
  @keyframes drift{0%{transform:translateX(-10vw)}100%{transform:translateX(110vw)}}
  .sunray{
    background:radial-gradient(circle, rgba(255,200,87,0.35), transparent 70%);
    animation:pulse 4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:0.5;transform:scale(1)}50%{opacity:0.9;transform:scale(1.08)}}

  .app{
    position:relative;
    z-index:1;
    width:100%;
    max-width:440px;
  }

  /* top bar */
  .topbar{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:22px;
  }
  .search{
    flex:1;
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--card);
    border:1px solid var(--card-border);
    backdrop-filter:blur(14px);
    border-radius:14px;
    padding:10px 14px;
  }
  .search svg{flex-shrink:0;opacity:0.7}
  .search input{
    flex:1;
    background:none;
    border:none;
    outline:none;
    color:var(--text);
    font-size:15px;
    font-family:'Inter',sans-serif;
  }
  .search input::placeholder{color:var(--text-dim)}
  .icon-btn{
    width:42px;height:42px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--card);
    border:1px solid var(--card-border);
    backdrop-filter:blur(14px);
    border-radius:12px;
    cursor:pointer;
    color:var(--text);
    transition:background .2s;
  }
  .icon-btn:hover{background:rgba(255,255,255,0.18)}
  .unit-toggle{
    display:flex;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:12px;
    overflow:hidden;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
  }
  .unit-toggle button{
    background:none;border:none;color:var(--text-dim);
    padding:10px 12px;cursor:pointer;font-family:inherit;font-size:inherit;
  }
  .unit-toggle button.active{background:rgba(255,255,255,0.22);color:var(--text)}

  /* hero */
  .hero{
    text-align:center;
    padding:18px 0 8px;
  }
  .hero .place{
    font-size:15px;
    letter-spacing:0.04em;
    color:var(--text-dim);
    text-transform:uppercase;
    font-family:'JetBrains Mono',monospace;
  }
  .hero .date{
    font-size:13px;
    color:var(--text-dim);
    margin-top:4px;
  }
  .hero .icon-wrap{
    width:110px;height:110px;
    margin:10px auto 0;
  }
  .hero .icon-wrap img{width:100%;height:100%;}
  .hero .temp{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:96px;
    line-height:1;
    letter-spacing:-0.03em;
  }
  .hero .temp sup{
    font-size:36px;
    font-weight:500;
    top:-0.5em;
  }
  .hero .condition{
    font-family:'Space Grotesk',sans-serif;
    font-size:20px;
    font-weight:500;
    margin-top:4px;
  }
  .hero .feels{
    font-size:13px;
    color:var(--text-dim);
    margin-top:4px;
  }

  /* instrument strip */
  .instruments{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:22px;
  }
  .instrument{
    background:var(--card);
    border:1px solid var(--card-border);
    backdrop-filter:blur(14px);
    border-radius:16px;
    padding:12px 8px;
    text-align:center;
  }
  .instrument .label{
    font-size:10px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:6px;
  }
  .instrument .value{
    font-family:'JetBrains Mono',monospace;
    font-size:15px;
    font-weight:500;
  }

  /* section titles */
  .section-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.02em;
    margin:26px 0 10px 2px;
    color:var(--text-dim);
    text-transform:uppercase;
  }

  /* hourly scroller */
  .hourly{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding-bottom:6px;
    scrollbar-width:none;
  }
  .hourly::-webkit-scrollbar{display:none}
  .hour-card{
    flex:0 0 auto;
    min-width:64px;
    background:var(--card);
    border:1px solid var(--card-border);
    backdrop-filter:blur(14px);
    border-radius:16px;
    padding:12px 8px;
    text-align:center;
  }
  .hour-card .h-time{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
  }
  .hour-card img{width:34px;height:34px;margin:6px 0;}
  .hour-card .h-temp{
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    font-weight:600;
  }

  /* daily list */
  .daily{
    background:var(--card);
    border:1px solid var(--card-border);
    backdrop-filter:blur(14px);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .day-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 16px;
    border-bottom:1px solid rgba(255,255,255,0.10);
  }
  .day-row:last-child{border-bottom:none}
  .day-row .d-name{
    width:64px;
    font-size:13px;
    font-weight:500;
  }
  .day-row img{width:30px;height:30px;}
  .day-row .d-cond{
    flex:1;
    font-size:12px;
    color:var(--text-dim);
  }
  .day-row .d-range{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    display:flex;
    gap:6px;
  }
  .day-row .d-range .lo{color:var(--text-dim)}

  /* states */
  .state-msg{
    text-align:center;
    padding:60px 20px;
    color:var(--text-dim);
    font-size:14px;
  }
  .hidden{display:none !important;}

  @media(max-width:420px){
    .hero .temp{font-size:80px}
    .instruments{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>

<div id="sky"></div>

<div class="app">

  <div class="topbar">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="locationInput" type="text" placeholder="Search city…" autocomplete="off">
    </div>
    <div class="icon-btn" id="geoBtn" title="Use my location">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M22 12h-3M5 12H2"/></svg>
    </div>
    <div class="unit-toggle">
      <button id="unitC" class="active">°C</button>
      <button id="unitF">°F</button>
    </div>
  </div>

  <div id="stateMsg" class="state-msg">Search a city or use your location to see the sky.</div>

  <div id="content" class="hidden">

    <div class="hero">
      <div class="place" id="place">—</div>
      <div class="date" id="date">—</div>
      <div class="icon-wrap"><img id="condIcon" alt=""></div>
      <div class="temp" id="temp">--<sup>°</sup></div>
      <div class="condition" id="condText">—</div>
      <div class="feels" id="feels">—</div>
    </div>

    <div class="instruments">
      <div class="instrument"><div class="label">Humidity</div><div class="value" id="humidity">—</div></div>
      <div class="instrument"><div class="label">Wind</div><div class="value" id="wind">—</div></div>
      <div class="instrument"><div class="label">UV</div><div class="value" id="uv">—</div></div>
      <div class="instrument"><div class="label">Pressure</div><div class="value" id="pressure">—</div></div>
    </div>

    <div class="section-title">Next 24 hours</div>
    <div class="hourly" id="hourly"></div>

    <div class="section-title">5-day forecast</div>
    <div class="daily" id="daily"></div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
